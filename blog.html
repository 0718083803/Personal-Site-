<!DOCTYPE html>
<html>
    <head>
        <title>Blog</title>
        <meta charset = "UTF-8">
        </head>
        <body>
            <ul>
                <li><a href = "Welcome.html">Welcome</a></li>
                <li><a href = "index.html">About</a></li>
                <li><a href = "blog.html">Blog</a></li>
                <li><a href = "contact.html">Contact</a></li>
            </ul>
            <article class = post-card>
                <img src = "https://picsum.photos/800/400?random=1" alt = "Blog cover" class = "post-image">
                <div class = "post-content">
                    <span class = post-category>Tech</span>
                    <h2>Future of technology</h2>
                    <p >Published on Octover 5,2026. 5 min read</p>
                    <p>Web development is constantly changing. LETS exlpore how we can manage to survive in the era </p>
                </div>
            </article>
        </body>
        <style>
                :root{
                    --bg: #f5f2ee;
                    --panel: #ffffff;
                    --text: #1c1c1c;
                    --muted: #66615b;
                    ---line: #e7e1d8;
                    ---chip:#f1eee8
                }
                *{
                    box-sizing: border-box;
                }
                body{
                    margin: 0;
                    padding: 32px 20px
                    background: var(--bg);
                    color: var(--text);
                    font-family: "Segoe UI",Arial, sans-serif;
                    line-height: 1.6;
                }
                ul{
                    list-style: none;
                    display: flex;
                    flex-wrap:wrap;
                    gap: 14px;
                    padding: 0;
                    margin: 0 0 28px;
                }
                                
                li a {
                color: var(--text);
                text-decoration: none;
                font-size: 0.95rem;
                padding: 6px 10px;
                border-radius: 999px;
                transition: background 0.2s ease;
                }

                li a:hover {
                background: #efeae1;
                }

                .post-card {
                max-width: 820px;
                margin: 0 auto;
                background: var(--panel);
                border: 1px solid var(--line);
                border-radius: 14px;
                overflow: hidden;
                }

                .post-image {
                display: block;
                width: 100%;
                height: 260px;
                object-fit: cover;
                }

                .post-content {
                padding: 20px 22px 24px;
                }

                .post-category {
                display: inline-block;
                padding: 6px 10px;
                border-radius: 999px;
                background: var(--chip);
                color: var(--muted);
                font-size: 0.72rem;
                letter-spacing: 0.08em;
                text-transform: uppercase;
                font-weight: 600;
                }

                h2 {
                margin: 12px 0 6px;
                font-size: clamp(1.8rem, 2.5vw, 2.5rem);
                line-height: 1.2;
                font-weight: 700;
                letter-spacing: -0.03em;
                }

                .post-content p {
                margin: 8px 0;
                color: var(--muted);
                font-size: 0.98rem;
                }

                @media (max-width: 600px) {
                body {
                    padding: 20px 14px;
                }

                .post-content {
                    padding: 16px 16px 20px;
                }

                .post-image {
                    height: 200px;
                }
                }
            </style>
</html>
