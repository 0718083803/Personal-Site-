<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Welcome to Sande Site</title>
    <style>
        body {
            background-color: #51e2f5;
            font-family: Arial, sans-serif;
            margin: 0;
        }

        h1 {
            color: blue;
            font-size: 50px;
            margin-left: 30%;
        }

        h3 {
            color: black;
            font-size: 30px;
            margin-left: 30%;
        }

        button {
            background-color: #153b37;
            color: #edf756;
            font-size: 20px;
            text-align: center;
            padding: 15px 32px;
            text-decoration: none;
            display: inline-block;
            cursor: pointer;
            margin-left: 40%;
            border-radius: 12px;
            border: none;
        }

        button:hover {
            background-color: #454641;
            color: #9df9ef;
            box-shadow: 0 8px 16px 0 rgba(0,0,0,0.6);
        }

        ul {
            list-style-type: none;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #333333;
        }

        ul li {
            float: left;
        }

        ul li a {
            display: block;
            color: white;
            text-align: center;
            padding: 14px 16px;
            text-decoration: none;
        }

        ul li a:hover {
            background-color: #111111;
        }

        li a {
            display: block;
            color: black;
            padding: 8px 16px;
            text-decoration: none;
        }

        li a:hover {
            background-color: #555;
            color: white;
        }
    </style>
</head>
<body>
    <ul>
        <li><a href="Welcome.html">Welcome</a></li>
        <li><a href="index.html">About</a></li>
        <li><a href="blog.html">Blog</a></li>
        <li><a href="contact.html">Contact</a></li>
    </ul>

    <h1>Welcome to my site</h1>

    <button id="button1" type="button">Click here to know more about me</button>

    <script>
        document.getElementById("button1").addEventListener("click", function () {
            window.location.href = "index.html";
        });
    </script>
</body>
</html>
